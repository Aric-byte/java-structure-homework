<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 980 720" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- ====== 浏览器 ====== -->
  <ellipse cx="340" cy="50" rx="80" ry="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="340" y="55" text-anchor="middle" font-size="15" fill="#374151" font-weight="bold">浏览器发起请求</text>

  <line x1="340" y1="78" x2="340" y2="100" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ====== DispatcherServlet ① ====== -->
  <rect x="220" y="100" width="240" height="56" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
  <circle cx="226" cy="106" r="12" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <text x="226" y="110" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">①</text>
  <text x="340" y="122" text-anchor="middle" font-size="16" fill="#92400e" font-weight="bold">DispatcherServlet</text>
  <text x="340" y="140" text-anchor="middle" font-size="12" fill="#b45309">前端控制器 · web.xml 注册</text>
  <text x="480" y="126" font-size="12" fill="#6b7280">统一接收所有请求</text>
  <text x="480" y="142" font-size="12" fill="#6b7280">分发到后端组件</text>

  <line x1="340" y1="156" x2="340" y2="182" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ====== HandlerMapping ② ====== -->
  <rect x="220" y="182" width="240" height="52" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <circle cx="226" cy="188" r="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="226" y="192" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">②</text>
  <text x="340" y="203" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">HandlerMapping</text>
  <text x="340" y="220" text-anchor="middle" font-size="12" fill="#2563eb">根据 URL 找到 Controller 方法</text>
  <text x="480" y="205" font-size="12" fill="#6b7280">解析 URL 路径</text>
  <text x="480" y="221" font-size="12" fill="#6b7280">匹配到对应 Controller</text>

  <line x1="340" y1="234" x2="340" y2="260" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ====== HandlerAdapter ③ ====== -->
  <rect x="220" y="260" width="240" height="52" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <circle cx="226" cy="266" r="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="226" y="270" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">③</text>
  <text x="340" y="281" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">HandlerAdapter</text>
  <text x="340" y="298" text-anchor="middle" font-size="12" fill="#2563eb">参数绑定 · 反射调用 Controller</text>
  <text x="480" y="283" font-size="12" fill="#6b7280">完成参数绑定</text>
  <text x="480" y="299" font-size="12" fill="#6b7280">反射调用 Controller 方法</text>

  <line x1="340" y1="312" x2="340" y2="338" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ====== 拦截器 preHandle 菱形 ====== -->
  <polygon points="340,338 410,378 340,418 270,378" fill="#fce7f3" stroke="#db2777" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="340" y="375" text-anchor="middle" font-size="13" fill="#9d174d" font-weight="bold">拦截器</text>
  <text x="340" y="392" text-anchor="middle" font-size="12" fill="#9d174d">preHandle</text>

  <!-- false 分支 → 中断 -->
  <line x1="270" y1="378" x2="90" y2="378" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="-10" y="355" width="100" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="40" y="375" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">中断请求</text>
  <text x="40" y="391" text-anchor="middle" font-size="11" fill="#b91c1c">直接返回响应</text>
  <text x="180" y="368" font-size="12" fill="#dc2626" font-weight="bold">false</text>

  <!-- true 分支继续 -->
  <line x1="340" y1="418" x2="340" y2="444" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="352" y="435" font-size="12" fill="#16a34a" font-weight="bold">true 放行</text>

  <!-- ====== Controller 方法 ④ ====== -->
  <rect x="220" y="444" width="240" height="52" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)"/>
  <circle cx="226" cy="450" r="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="226" y="454" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">④</text>
  <text x="340" y="465" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">Controller 方法</text>
  <text x="340" y="482" text-anchor="middle" font-size="12" fill="#16a34a">执行业务逻辑，返回结果</text>
  <text x="480" y="467" font-size="12" fill="#6b7280">学生写业务代码</text>
  <text x="480" y="483" font-size="12" fill="#6b7280">返回处理结果</text>

  <line x1="340" y1="496" x2="340" y2="522" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ====== 返回值 判断菱形 ====== -->
  <polygon points="340,522 410,562 340,602 270,562" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="340" y="559" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold">返回值</text>
  <text x="340" y="576" text-anchor="middle" font-size="11" fill="#92400e">类型？</text>

  <!-- 左分支：@ResponseBody → 写 JSON -->
  <line x1="270" y1="562" x2="110" y2="562" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="0" y="540" width="110" height="46" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="55" y="560" text-anchor="middle" font-size="13" fill="#065f46" font-weight="bold">@ResponseBody</text>
  <text x="55" y="576" text-anchor="middle" font-size="11" fill="#047857">直接写 JSON 响应</text>
  <text x="180" y="552" font-size="11" fill="#059669" font-weight="bold">@ResponseBody</text>

  <!-- 右分支：ModelAndView/String → ViewResolver -->
  <line x1="410" y1="562" x2="560" y2="562" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="450" y="552" font-size="11" fill="#dc2626" font-weight="bold">ModelAndView / String</text>

  <rect x="560" y="532" width="150" height="46" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="566" cy="538" r="12" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="566" y="542" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">⑤</text>
  <text x="635" y="552" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">ViewResolver</text>
  <text x="635" y="568" text-anchor="middle" font-size="11" fill="#b91c1c">找 JSP → 渲染 HTML</text>
  <text x="720" y="552" font-size="12" fill="#6b7280">逻辑视图名</text>
  <text x="720" y="568" font-size="12" fill="#6b7280">→ JSP 物理路径</text>

  <!-- ====== 图例 ====== -->
  <g transform="translate(60, 660)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <text x="20" y="12" font-size="11" fill="#4b5563">入口（1 个）</text>

    <rect x="110" y="0" width="14" height="14" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <text x="130" y="12" font-size="11" fill="#4b5563">路由层</text>

    <rect x="210" y="0" width="14" height="14" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
    <text x="230" y="12" font-size="11" fill="#4b5563">业务层</text>

    <polygon points="317,0 324,7 317,14 310,7" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="330" y="12" font-size="11" fill="#4b5563">判断/分支</text>

    <rect x="430" y="0" width="14" height="14" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="450" y="12" font-size="11" fill="#4b5563">REST 响应</text>

    <rect x="530" y="0" width="14" height="14" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
    <text x="550" y="12" font-size="11" fill="#4b5563">视图响应 / 中断</text>
  </g>
</svg>