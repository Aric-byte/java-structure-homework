# 资料上传下载系统 —— 上传配置（禁止在代码中硬编码路径，统一从这里读取）

# 上传根目录：文件按 <根目录>/<用户名>/<年>/<月>/<UUID>.<扩展名> 落盘
# ${user.home} 由 Spring 从系统属性解析；需要固定目录时可改为 D:/ssm-upload 之类
upload.root=${user.home}/ssm-filesys-upload

# 单个文件大小上限（字节）：10MB，由服务端代码校验
upload.max-size=10485760

# 扩展名白名单（小写、逗号分隔），由服务端代码校验
upload.allowed-ext=pdf,jpg,png,doc,docx,zip
